<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#071f49">
  <title>ACV Meeting Dashboard</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #031126;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 8% 0%, rgba(0, 165, 229, .20), transparent 34%),
        radial-gradient(circle at 94% 100%, rgba(20, 91, 196, .20), transparent 38%),
        #031126;
    }

    #dashboard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3840px;
      height: 2160px;
      transform-origin: center;
      overflow: hidden;
      color: #f7fbff;
      background: linear-gradient(135deg, rgba(7, 38, 82, .98), rgba(2, 15, 35, .99) 55%, rgba(5, 28, 62, .98));
    }

    #dashboard::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 90px 90px;
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 100px 124px 82px;
      display: grid;
      grid-template-rows: 300px 1fr 84px;
      gap: 46px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 62px;
      border: 1px solid rgba(125, 207, 255, .24);
      border-radius: 48px;
      background: linear-gradient(120deg, rgba(12, 57, 117, .82), rgba(4, 24, 54, .78));
      box-shadow: 0 28px 80px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255,255,255,.07);
    }

    .brand { display: flex; align-items: center; gap: 48px; }

    .mark {
      width: 172px;
      height: 172px;
      display: grid;
      place-items: center;
      border-radius: 44px;
      color: white;
      font-size: 68px;
      font-weight: 900;
      letter-spacing: -5px;
      background: linear-gradient(145deg, #00a9e7, #0752ad);
      box-shadow: 0 22px 60px rgba(0, 154, 225, .28);
    }

    h1 {
      margin: 0;
      font-size: 92px;
      line-height: 1;
      letter-spacing: -3px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 25px;
      color: #9ec8ef;
      font-size: 37px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .date-block { text-align: right; }

    #day-label {
      color: #7fd7ff;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    #date-label {
      margin-top: 13px;
      font-size: 82px;
      font-weight: 850;
      letter-spacing: 2px;
    }

    #schedule {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 34px;
    }

    .meeting {
      min-height: 0;
      padding: 42px 46px;
      display: grid;
      grid-template-columns: 245px 1fr;
      gap: 38px;
      overflow: hidden;
      border: 1px solid rgba(130, 205, 255, .22);
      border-radius: 38px;
      background: linear-gradient(145deg, rgba(16, 55, 103, .88), rgba(5, 29, 62, .88));
      box-shadow: 0 22px 55px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.05);
    }

    .meeting.cancelled {
      opacity: .7;
      border-color: rgba(255, 121, 121, .42);
    }

    .time {
      padding-right: 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 2px solid rgba(78, 184, 240, .30);
    }

    .start {
      color: #60d4ff;
      font-size: 68px;
      font-weight: 850;
      letter-spacing: 1px;
    }

    .end {
      margin-top: 18px;
      color: #8eaecf;
      font-size: 33px;
      font-weight: 650;
    }

    .details {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .title {
      display: -webkit-box;
      overflow: hidden;
      color: #fff;
      font-size: 42px;
      font-weight: 780;
      line-height: 1.19;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .meta {
      margin-top: 26px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px 30px;
      color: #b7d1e9;
      font-size: 28px;
      line-height: 1.25;
    }

    .meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta strong { color: #69cfff; font-weight: 700; }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: #7999b9;
      font-size: 28px;
      letter-spacing: 1px;
    }

    #clock { color: #b7d8f4; font-variant-numeric: tabular-nums; }

    .state {
      height: 100%;
      grid-column: 1 / -1;
      display: grid;
      place-items: center;
      text-align: center;
      color: #9ec8ef;
      font-size: 50px;
    }

    .state strong {
      display: block;
      margin-bottom: 20px;
      color: white;
      font-size: 72px;
    }

    #schedule[data-density="high"] .meeting { padding: 30px 36px; grid-template-columns: 210px 1fr; }
    #schedule[data-density="high"] .start { font-size: 58px; }
    #schedule[data-density="high"] .title { font-size: 35px; -webkit-line-clamp: 2; }
    #schedule[data-density="high"] .meta { margin-top: 16px; font-size: 23px; }
  </style>
</head>

<body>
  <main id="viewport">
    <section id="dashboard" aria-label="Lịch họp ACV">
      <div class="shell">
        <header>
          <div class="brand">
            <div class="mark">ACV</div>
            <div>
              <h1>Lịch họp hôm nay</h1>
              <div class="subtitle">Tổng công ty Cảng hàng không Việt Nam</div>
            </div>
          </div>
          <div class="date-block">
            <div id="day-label">Đang tải</div>
            <div id="date-label">--/--/----</div>
          </div>
        </header>

        <div id="schedule">
          <div class="state"><div><strong>Đang tải lịch họp</strong>Vui lòng chờ trong giây lát…</div></div>
        </div>

        <footer>
          <span>Dữ liệu trực tiếp từ Google Sheets · tự động cập nhật mỗi 60 giây</span>
          <span id="clock">--:--:--</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    const SHEET_ID = "1GBpoK1CnM8MZ6yMA__G2DrHQDpGVogWAtlRj7naFAHU";
    const CANVAS_GID = "1366504035"; // Reference only: Google blocks Canvas tabs in embeds.
    const DATA_GID = "1071047193";   // Source tab used by the Canvas.
    const DESIGN_WIDTH = 3840;
    const DESIGN_HEIGHT = 2160;
    const REFRESH_INTERVAL = 60 * 1000;

    const dashboard = document.getElementById("dashboard");
    const schedule = document.getElementById("schedule");
    const dayLabel = document.getElementById("day-label");
    const dateLabel = document.getElementById("date-label");
    const clock = document.getElementById("clock");
    const queryBase = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;

    let selectedDate = "";
    let allMeetings = [];
    let loadedDate = false;
    let loadedMeetings = false;

    const scaleDashboard = () => {
      const scale = Math.min(innerWidth / DESIGN_WIDTH, innerHeight / DESIGN_HEIGHT);
      dashboard.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };

    const cellText = (cell) => cell?.f ?? cell?.v ?? "";

    const vietnameseDay = (dateText) => {
      const [day, month, year] = dateText.split("/").map(Number);
      if (!day || !month || !year) return "Lịch họp";
      const names = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
      return names[new Date(year, month - 1, day).getDay()];
    };

    const addText = (parent, className, value) => {
      const element = document.createElement("div");
      element.className = className;
      element.textContent = value;
      parent.appendChild(element);
      return element;
    };

    const addMeta = (parent, label, value) => {
      const item = document.createElement("span");
      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;
      item.append(strong, document.createTextNode(value || "—"));
      parent.appendChild(item);
    };

    const render = () => {
      if (!loadedDate || !loadedMeetings) return;

      dayLabel.textContent = vietnameseDay(selectedDate);
      dateLabel.textContent = selectedDate || "--/--/----";

      const meetings = allMeetings
        .filter((meeting) => meeting.date === selectedDate)
        .sort((a, b) => a.start.localeCompare(b.start));

      schedule.replaceChildren();
      schedule.dataset.density = meetings.length > 9 ? "high" : "normal";
      schedule.style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(meetings.length / 3))}, minmax(0, 1fr))`;

      if (!meetings.length) {
        const state = document.createElement("div");
        state.className = "state";
        const content = document.createElement("div");
        const heading = document.createElement("strong");
        heading.textContent = "Không có lịch họp";
        content.append(heading, document.createTextNode("Không tìm thấy cuộc họp cho ngày đã chọn."));
        state.appendChild(content);
        schedule.appendChild(state);
        return;
      }

      meetings.forEach((meeting) => {
        const card = document.createElement("article");
        card.className = `meeting${/hủy/i.test(meeting.status) ? " cancelled" : ""}`;

        const time = document.createElement("div");
        time.className = "time";
        addText(time, "start", meeting.start || "--:--");
        addText(time, "end", meeting.end ? `đến ${meeting.end}` : "");

        const details = document.createElement("div");
        details.className = "details";
        addText(details, "title", meeting.title || "Cuộc họp");

        const meta = document.createElement("div");
        meta.className = "meta";
        addMeta(meta, "Địa điểm", meeting.location);
        addMeta(meta, "Chủ trì", meeting.host);
        if (meeting.notice) addMeta(meta, "Thông báo", meeting.notice);
        if (meeting.status && meeting.status !== "Theo lịch") addMeta(meta, "Trạng thái", meeting.status);
        details.appendChild(meta);

        card.append(time, details);
        schedule.appendChild(card);
      });
    };

    window.receiveDisplayDate = (response) => {
      loadedDate = true;
      if (response?.status === "ok") selectedDate = cellText(response.table.rows?.[0]?.c?.[0]);
      render();
    };

    window.receiveSchedule = (response) => {
      loadedMeetings = true;
      if (response?.status === "ok") {
        allMeetings = (response.table.rows || []).map(({ c = [] }) => ({
          date: cellText(c[0]),
          start: cellText(c[1]),
          end: cellText(c[2]),
          title: cellText(c[3]),
          location: cellText(c[4]),
          host: cellText(c[5]),
          status: cellText(c[6]),
          notice: cellText(c[7])
        })).filter((meeting) => meeting.date && meeting.title);
      }
      render();
    };

    const loadJsonp = (id, range, callback, headers) => {
      document.getElementById(id)?.remove();
      const script = document.createElement("script");
      script.id = id;
      const params = new URLSearchParams({
        gid: DATA_GID,
        range,
        headers: String(headers),
        tqx: `responseHandler:${callback};out:json`,
        _: String(Date.now())
      });
      script.src = `${queryBase}?${params}`;
      document.head.appendChild(script);
    };

    const refresh = () => {
      loadedDate = false;
      loadedMeetings = false;
      loadJsonp("date-data", "B2", "receiveDisplayDate", 0);
      loadJsonp("schedule-data", "A5:H500", "receiveSchedule", 1);
    };

    const updateClock = () => {
      clock.textContent = new Intl.DateTimeFormat("vi-VN", {
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        day: "2-digit", month: "2-digit", year: "numeric"
      }).format(new Date());
    };

    addEventListener("resize", scaleDashboard, { passive: true });
    addEventListener("orientationchange", scaleDashboard, { passive: true });
    scaleDashboard();
    updateClock();
    refresh();
    setInterval(updateClock, 1000);
    setInterval(refresh, REFRESH_INTERVAL);
  </script>
</body>
</html>
