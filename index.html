<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1e429a">
  <title>ACV Meeting Dashboard</title>

  <style>
    @font-face {
      font-family: "ACV Sans";
      src: url("acv-sans-regular.otf") format("opentype");
      font-display: swap;
      font-style: normal;
      font-weight: 100 900;
    }

    :root {
      --acv-cobalt: #1e429a;
      --acv-cobalt-dark: #102f78;
      --acv-cobalt-soft: #eaf0fb;
      --acv-turquoise: #00ffc4;
      --ink: #12254b;
      --muted: #536987;
      --line: #cad6ea;
      --surface: #ffffff;
      font-family: "ACV Sans", Verdana, Arial, sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dfe7f4;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #dfe7f4;
    }

    #dashboard {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3840px;
      height: 2160px;
      overflow: hidden;
      transform-origin: center;
      background:
        linear-gradient(90deg, rgba(30, 66, 154, .035) 1px, transparent 1px),
        linear-gradient(rgba(30, 66, 154, .035) 1px, transparent 1px),
        #f5f7fb;
      background-size: 96px 96px;
    }

    .shell {
      height: 100%;
      padding: 72px 104px 58px;
      display: grid;
      grid-template-rows: 310px minmax(0, 1fr) 72px;
      gap: 34px;
    }

    header {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 850px;
      overflow: hidden;
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 18px 55px rgba(29, 62, 128, .13);
    }

    header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 850px;
      bottom: 0;
      height: 13px;
      background: linear-gradient(90deg, var(--acv-turquoise) 0 36%, var(--acv-cobalt) 36% 100%);
    }

    .brand {
      min-width: 0;
      padding: 47px 70px 54px;
      display: flex;
      align-items: center;
      gap: 68px;
    }

    .logo-wrap {
      width: 430px;
      flex: 0 0 430px;
      padding-right: 68px;
      border-right: 2px solid var(--line);
    }

    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .brand-copy { min-width: 0; }

    h1 {
      margin: 0;
      color: var(--acv-cobalt);
      font-size: 86px;
      font-weight: 800;
      line-height: .98;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 24px;
      color: var(--muted);
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .date-block {
      position: relative;
      isolation: isolate;
      padding: 54px 70px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      color: white;
      text-align: right;
      background: var(--acv-cobalt);
    }

    .date-block::before,
    .date-block::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 420px;
      height: 78px;
      right: -92px;
      background: var(--acv-turquoise);
      opacity: .16;
      transform: skewX(-38deg);
    }

    .date-block::before { top: 35px; }
    .date-block::after { bottom: 38px; right: 70px; }

    #day-label {
      color: var(--acv-turquoise);
      font-size: 43px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    #date-label {
      margin-top: 13px;
      font-size: 82px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 1px;
    }

    #schedule {
      --schedule-columns: 3;
      --schedule-rows: 3;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(var(--schedule-columns), minmax(0, 1fr));
      grid-template-rows: repeat(var(--schedule-rows), minmax(0, 1fr));
      gap: 28px;
    }

    .meeting {
      --title-size: 43px;
      --meta-size: 29px;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 110px minmax(0, 1fr);
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(24, 55, 120, .08);
    }

    .meeting.cancelled { border-color: #f09b9b; }

    .meeting-head {
      padding: 0 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: white;
      background: var(--acv-cobalt);
    }

    .meeting.cancelled .meeting-head { background: #9d3340; }

    .time {
      display: flex;
      align-items: baseline;
      gap: 24px;
      white-space: nowrap;
    }

    .start {
      font-size: 55px;
      font-weight: 850;
      line-height: 1;
      letter-spacing: 1px;
    }

    .end {
      color: #dce8ff;
      font-size: 29px;
      line-height: 1;
    }

    .status {
      max-width: 48%;
      padding: 12px 20px 10px;
      overflow-wrap: anywhere;
      border: 2px solid rgba(0, 255, 196, .58);
      border-radius: 999px;
      color: var(--acv-turquoise);
      font-size: 25px;
      font-weight: 700;
      line-height: 1.05;
      text-align: right;
    }

    .meeting-body {
      min-height: 0;
      padding: 31px 38px 34px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 25px;
    }

    .title {
      color: var(--acv-cobalt-dark);
      font-size: var(--title-size);
      font-weight: 800;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      gap: 16px;
      color: var(--ink);
      font-size: var(--meta-size);
      line-height: 1.22;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .meta-label {
      color: var(--acv-cobalt);
      font-weight: 800;
    }

    .meta-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 15px 20px 13px;
      border-left: 8px solid var(--acv-turquoise);
      color: var(--acv-cobalt-dark);
      background: #e9fff9;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 27px;
      line-height: 1;
    }

    #clock {
      color: var(--acv-cobalt);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .state {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 24px;
      color: var(--muted);
      background: white;
      text-align: center;
      font-size: 42px;
    }

    .state strong {
      display: block;
      margin-bottom: 20px;
      color: var(--acv-cobalt);
      font-size: 66px;
    }
  </style>
</head>

<body>
  <main id="viewport">
    <section id="dashboard" aria-label="Lịch họp ACV">
      <div class="shell">
        <header>
          <div class="brand">
            <div class="logo-wrap">
              <img src="acv-logo.png" alt="ACV">
            </div>
            <div class="brand-copy">
              <h1>Lịch họp hôm nay</h1>
              <div class="subtitle">Tổng công ty Cảng hàng không Việt Nam</div>
            </div>
          </div>
          <div class="date-block">
            <div id="day-label">Đang tải</div>
            <div id="date-label">--/--/----</div>
          </div>
        </header>

        <div id="schedule">
          <div class="state"><div><strong>Đang tải lịch họp</strong>Vui lòng chờ trong giây lát...</div></div>
        </div>

        <footer>
          <span id="clock">--:--:--</span>
        </footer>
      </div>
    </section>
  </main>

  <script>
    const SHEET_ID = "1GBpoK1CnM8MZ6yMA__G2DrHQDpGVogWAtlRj7naFAHU";
    const CANVAS_GID = "1366504035"; // Reference only: Google blocks Canvas tabs in embeds.
    const DATA_GID = "1071047193";   // Source tab used by the Canvas.
    const DESIGN_WIDTH = 3840;
    const DESIGN_HEIGHT = 2160;
    const REFRESH_INTERVAL = 60 * 1000;
    const FULL_PAGE_REFRESH_INTERVAL = 5 * 60 * 1000;
    const TIME_ZONE = "Asia/Ho_Chi_Minh";
    const NEXT_DAY_HOUR = 19;

    const dashboard = document.getElementById("dashboard");
    const schedule = document.getElementById("schedule");
    const dayLabel = document.getElementById("day-label");
    const dateLabel = document.getElementById("date-label");
    const clock = document.getElementById("clock");
    const queryBase = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;

    let allMeetings = [];
    let loadedMeetings = false;
    let displayedDate = "";

    const scaleDashboard = () => {
      const scale = Math.min(innerWidth / DESIGN_WIDTH, innerHeight / DESIGN_HEIGHT);
      dashboard.style.transform = `translate(-50%, -50%) scale(${scale})`;
    };

    const cellText = (cell) => String(cell?.f ?? cell?.v ?? "").trim();

    const vietnameseDay = (dateText) => {
      const [day, month, year] = dateText.split("/").map(Number);
      if (!day || !month || !year) return "Lịch họp";
      const names = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
      return names[new Date(Date.UTC(year, month - 1, day)).getUTCDay()];
    };

    const displayDateFor = (now = new Date()) => {
      const parts = Object.fromEntries(
        new Intl.DateTimeFormat("en-GB", {
          timeZone: TIME_ZONE,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          hourCycle: "h23"
        }).formatToParts(now).filter(({ type }) => type !== "literal").map(({ type, value }) => [type, value])
      );

      const date = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day)));
      if (Number(parts.hour) >= NEXT_DAY_HOUR) date.setUTCDate(date.getUTCDate() + 1);

      return [
        String(date.getUTCDate()).padStart(2, "0"),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        date.getUTCFullYear()
      ].join("/");
    };

    const makeElement = (tag, className, text) => {
      const element = document.createElement(tag);
      element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    };

    const addMeta = (parent, label, value, extraClass = "") => {
      const row = makeElement("div", `meta-row ${extraClass}`.trim());
      row.append(
        makeElement("div", "meta-label", label),
        makeElement("div", "meta-value", value || "-")
      );
      parent.appendChild(row);
    };

    const fitCard = (card) => {
      const title = card.querySelector(".title");
      const meta = card.querySelector(".meta");
      let titleSize = 43;
      let metaSize = 29;

      card.style.setProperty("--title-size", `${titleSize}px`);
      card.style.setProperty("--meta-size", `${metaSize}px`);

      while (card.scrollHeight > card.clientHeight && titleSize > 25) {
        titleSize -= 1;
        metaSize = Math.max(20, metaSize - .55);
        card.style.setProperty("--title-size", `${titleSize}px`);
        card.style.setProperty("--meta-size", `${metaSize}px`);
      }

      if (card.scrollHeight > card.clientHeight) {
        title.style.lineHeight = "1.08";
        meta.style.lineHeight = "1.12";
      }
    };

    const renderMeetings = (meetings) => {
      schedule.replaceChildren();

      if (!meetings.length) {
        const state = makeElement("div", "state");
        const content = makeElement("div", "");
        content.append(
          makeElement("strong", "", "Không có lịch họp"),
          document.createTextNode("Không tìm thấy cuộc họp cho ngày đã chọn.")
        );
        state.appendChild(content);
        schedule.appendChild(state);
        return;
      }

      const columns = meetings.length <= 4 ? 2 : meetings.length <= 12 ? 3 : 4;
      const rows = Math.ceil(meetings.length / columns);
      schedule.style.setProperty("--schedule-columns", columns);
      schedule.style.setProperty("--schedule-rows", rows);

      meetings.forEach((meeting) => {
        const card = makeElement("article", `meeting${/hủy/i.test(meeting.status) ? " cancelled" : ""}`);
        const head = makeElement("div", "meeting-head");
        const time = makeElement("div", "time");
        time.append(
          makeElement("span", "start", meeting.start || "--:--"),
          makeElement("span", "end", meeting.end ? `đến ${meeting.end}` : "")
        );
        head.appendChild(time);
        if (meeting.status && meeting.status !== "Theo lịch") {
          head.appendChild(makeElement("span", "status", meeting.status));
        }

        const body = makeElement("div", "meeting-body");
        body.appendChild(makeElement("div", "title", meeting.title || "Cuộc họp"));

        const meta = makeElement("div", "meta");
        addMeta(meta, "Địa điểm", meeting.location);
        addMeta(meta, "Chủ trì", meeting.host);
        if (meeting.notice) addMeta(meta, "Thông báo", meeting.notice, "notice");
        body.appendChild(meta);

        card.append(head, body);
        schedule.appendChild(card);
      });

      requestAnimationFrame(() => schedule.querySelectorAll(".meeting").forEach(fitCard));
    };

    const render = () => {
      if (!loadedMeetings) return;

      const selectedDate = displayDateFor();
      displayedDate = selectedDate;

      dayLabel.textContent = vietnameseDay(selectedDate);
      dateLabel.textContent = selectedDate || "--/--/----";

      const meetings = allMeetings
        .filter((meeting) => meeting.date === selectedDate)
        .sort((a, b) => a.start.localeCompare(b.start));

      renderMeetings(meetings);
    };

    window.receiveSchedule = (response) => {
      loadedMeetings = true;
      if (response?.status === "ok") {
        allMeetings = (response.table.rows || []).map(({ c = [] }) => ({
          date: cellText(c[0]),
          start: cellText(c[1]),
          end: cellText(c[2]),
          title: cellText(c[3]),
          location: cellText(c[4]),
          host: cellText(c[5]),
          status: cellText(c[6]),
          notice: cellText(c[7])
        })).filter((meeting) => meeting.date && meeting.title);
      }
      render();
    };

    const loadJsonp = (id, range, callback, headers) => {
      document.getElementById(id)?.remove();
      const script = document.createElement("script");
      script.id = id;
      const params = new URLSearchParams({
        gid: DATA_GID,
        range,
        headers: String(headers),
        tqx: `responseHandler:${callback};out:json`,
        _: String(Date.now())
      });
      script.src = `${queryBase}?${params}`;
      document.head.appendChild(script);
    };

    const refresh = () => {
      loadedMeetings = false;
      loadJsonp("schedule-data", "A5:H500", "receiveSchedule", 1);
    };

    const updateClock = () => {
      clock.textContent = new Intl.DateTimeFormat("vi-VN", {
        timeZone: TIME_ZONE,
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      }).format(new Date());

      if (loadedMeetings && displayDateFor() !== displayedDate) render();
    };

    addEventListener("resize", scaleDashboard, { passive: true });
    addEventListener("orientationchange", scaleDashboard, { passive: true });
    scaleDashboard();
    updateClock();
    refresh();

    setInterval(updateClock, 1000);
    setInterval(refresh, REFRESH_INTERVAL);
    setInterval(() => location.reload(), FULL_PAGE_REFRESH_INTERVAL);
  </script>
</body>
</html>
